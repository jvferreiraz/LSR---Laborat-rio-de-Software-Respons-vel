<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achei! | Achados e Perdidos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-search-location"></i>
            <span>Achei!</span>
        </div>

        <nav id="navMenu">
            <a href="#inicio">Início</a>
            <a href="#itens">Itens</a>
            <a href="#contato">Contato</a>
        </nav>

        <button type="button" class="btn-primary" id="openModal">+ Anunciar</button>

        <div class="menu-mobile" id="menuMobile">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- ========================= -->
    <!-- HERO -->
    <!-- ========================= -->
    <section class="hero" id="inicio">
        <div class="hero-content">
            <h1>Perdeu alguma coisa?</h1>
            <p>Encontre objetos perdidos de forma rápida, simples e segura.</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar item...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </section>

    <!-- ========================= -->
    <!-- ITENS -->
    <!-- ========================= -->
    <section class="itens" id="itens">
        <div class="section-top">
            <h2>Itens Recentes</h2>

            <div class="filters">
                <button class="filter-btn active" data-status="todos">Todos</button>
                <button class="filter-btn" data-status="perdido">Perdidos</button>
                <button class="filter-btn" data-status="encontrado">Achados</button>
            </div>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Carregando itens...</p>
        </div>

        <!-- CARDS -->
        <div class="cards" id="cardsContainer"></div>

        <!-- PAGINAÇÃO -->
        <div class="pagination" id="paginationContainer"></div>
    </section>

    <!-- ========================= -->
    <!-- CONTATO -->
    <!-- ========================= -->
    <section class="contato" id="contato">
        <div class="contato-box">
            <h2>Fale Conosco</h2>
            <p>Dúvidas ou suporte técnico?</p>

            <form id="contactForm">
                <input type="text" placeholder="Seu Nome" required>
                <input type="email" placeholder="Seu E-mail" required>
                <textarea placeholder="Sua mensagem" required></textarea>
                <button type="submit" class="btn-primary">Enviar</button>
            </form>
        </div>
    </section>

    <!-- ========================= -->
    <!-- MODAL -->
    <!-- ========================= -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Anunciar Item</h2>

            <form id="itemForm">
                <input type="text" id="itemNome" placeholder="Nome do item" required>

                <select id="itemStatus" required>
                    <option value="">Tipo do anúncio</option>
                    <option value="perdido">Eu perdi</option>
                    <option value="encontrado">Eu encontrei</option>
                </select>

                <input type="date" id="itemData" placeholder="Data do ocorrido">

                <input type="text" id="itemLocal" placeholder="Local (opcional)">

                <textarea id="itemDescricao" placeholder="Descrição" required></textarea>

                <button type="submit" class="btn-primary" id="submitBtn">Publicar</button>
            </form>
        </div>
    </div>

    <!-- ========================= -->
    <!-- TOAST NOTIFICATIONS -->
    <!-- ========================= -->
    <div id="toast" class="toast"></div>

    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
